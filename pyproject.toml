[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kuantokusta-mcp"
version = "0.1.0"
description = "MCP server for searching products on KuantoKusta.pt price comparator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
kuantokusta-mcp = "kuantokusta_mcp.server:main"

[tool.setuptools]
packages = ["kuantokusta_mcp"]
